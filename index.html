<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT 발표 시연용 페이지</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        p {
            color: #7f8c8d;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #2ecc71;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👋 성공적으로 연결되었습니다!</h1>
        <p>깃허브 주소 앞에 <strong>htmlpreview</strong>를 붙여서 브라우저에 코드가 아닌 실제 웹 화면이 정상적으로 렌더링된 상태입니다.</p>
        <span class="badge">발표 준비 완료</span>
    </div>

</body>
</html>
